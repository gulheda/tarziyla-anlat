name: Bug report / Hata bildirimi
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected and what you saw.
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iPhone (web app), Web (desktop browser), Other]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About → Version
